<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-creator</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/pptxgen.bundle.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <strong class="brand">slide-creator</strong>
  <button id="btn-open" title="layout.yaml と画像を入れたフォルダを開く">フォルダを開く</button>
  <button id="btn-reopen" hidden></button>
  <button id="btn-demo">見本</button>
  <span class="sep"></span>
  <button id="btn-save" disabled title="⌘S">保存</button>
  <button id="btn-reload" disabled title="保存していない変更を捨てて、フォルダのファイルを読み直す">読み直す</button>
  <span class="sep"></span>
  <button id="btn-pptx" disabled>PPTX に書き出す</button>
  <button id="btn-pdf" disabled title="印刷画面で「PDFに保存」を選ぶ">PDF に書き出す</button>
  <span class="sep"></span>
  <label class="chk"><input type="checkbox" id="chk-outline" checked> 枠の線と名前を表示</label>
  <span id="project-name"></span>
  <span id="status"></span>
</header>
<main>
  <aside>
    <section id="global"></section>
    <section id="node"></section>
  </aside>
  <div class="stage">
    <div class="bar">
      <div id="slide-tabs"></div>
      <div id="crumbs"></div>
      <div class="zoom">
        <button id="btn-focus" disabled title="Enter">選んだ枠を拡大</button>
        <button id="btn-whole" disabled>全体を表示</button>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="プレビュー"></iframe>
      <div id="empty" class="empty">
        <p>「フォルダを開く」で、スライドの設定ファイル <code>layout.yaml</code> と画像を入れたフォルダを選んでください。<code>layout.yaml</code> が無いフォルダを選ぶと、新しく作ります。</p>
        <p>「見本」で、見本のスライドを開けます。見本はフォルダに保存できません（保存すると、ファイルをダウンロードします）。</p>
      </div>
    </div>
  </div>
</main>
<dialog id="crop-dialog">
  <form method="dialog">
    <h3>トリミング <small id="crop-src"></small></h3>
    <div id="crop-area"><img id="crop-img" alt=""><div id="crop-rect"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
    <div class="crop-tools">
      <label class="chk"><input type="checkbox" id="crop-lock"> 表示する枠と同じ縦横比にする</label>
      <span id="crop-values"></span>
    </div>
    <div class="crop-buttons">
      <button value="clear" id="crop-clear">トリミングを外す</button>
      <span class="sep"></span>
      <button value="cancel">取り消す</button>
      <button value="ok" class="primary">適用</button>
    </div>
  </form>
</dialog>
</body>
</html>
