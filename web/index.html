<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-creator</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/pptxgen.bundle.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <strong class="brand">slide-creator</strong>
  <button id="btn-open" title="layout.yaml と画像を入れたフォルダを開く">フォルダを開く</button>
  <button id="btn-reopen" hidden></button>
  <span class="sep"></span>
  <button id="btn-save" disabled title="⌘S">保存</button>
  <span class="sep"></span>
  <button id="btn-pptx" disabled>PPTX に書き出す</button>
  <button id="btn-pdf" disabled title="印刷画面で「PDFに保存」を選ぶ">PDF に書き出す</button>
  <span class="sep"></span>
  <label class="chk"><input type="checkbox" id="chk-outline" checked> ボックスの線を表示</label>
  <span id="project-name"></span>
  <span id="status"></span>
</header>
<main>
  <aside>
    <section id="global"></section>
    <section id="node"></section>
  </aside>
  <div class="stage">
    <div class="bar">
      <div id="slide-tabs"></div>
      <button id="btn-split" disabled title="選択中のボックスを分割">分割</button>
      <button id="btn-merge" disabled title="ドラッグで選んだボックスを 1 つにまとめる">統合</button>
      <button id="btn-delete" class="icon" disabled title="選択中のボックスを削除"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      <span class="zoom"><button id="btn-zoom-fit" class="icon" disabled title="選択中のボックスを左上に寄せ、画面いっぱいまで拡大"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><input type="range" id="zoom" min="100" max="800" step="10" value="100"><span id="zoom-val">100%</span></span>
      <button id="btn-whole" title="選択を外して全体を表示">全体表示</button>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="プレビュー"></iframe>
      <div id="toast" hidden></div>
      <div id="empty" class="empty">
        <p>「フォルダを開く」で、スライドの設定ファイル <code>layout.yaml</code> と画像を入れたフォルダを選んでください。<code>layout.yaml</code> が無いフォルダを選ぶと、新しく作ります。</p>
      </div>
    </div>
  </div>
</main>
<dialog id="split-dialog">
  <form method="dialog">
    <h3>選択中のボックスを分割</h3>
    <label class="split-n">分割数 <input type="number" id="split-n" min="2" max="12" value="2"></label>
    <div class="crop-buttons">
      <button type="button" id="split-cancel">取り消す</button>
      <span class="sep"></span>
      <button type="button" id="split-rows" class="primary">上下に分割</button>
      <button type="button" id="split-cols" class="primary">左右に分割</button>
    </div>
  </form>
</dialog>
<dialog id="crop-dialog">
  <form method="dialog">
    <h3>トリミング <small id="crop-src"></small></h3>
    <div id="crop-area"><img id="crop-img" alt=""><div id="crop-rect"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
    <div class="crop-tools">
      <label class="chk"><input type="checkbox" id="crop-lock"> 表示するボックスと同じ縦横比にする</label>
      <span id="crop-values"></span>
    </div>
    <div class="crop-buttons">
      <button value="clear" id="crop-clear">トリミングを外す</button>
      <span class="sep"></span>
      <button value="cancel">取り消す</button>
      <button value="ok" class="primary">適用</button>
    </div>
  </form>
</dialog>
</body>
</html>
